name: Set up Xcode
description: >-
  Select the Xcode build Echo is developed with and install the Metal
  toolchain that mlx-swift needs to compile its shaders. Shared by the CI
  and Release workflows so the toolchain is pinned in one place.

inputs:
  xcode:
    description: >-
      The Xcode to select. The default is the oldest one the README promises
      to build with, which is also what releases are built with; CI adds the
      newest one on the runner that carries it.
    required: false
    default: /Applications/Xcode_26.6.app

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: sudo xcode-select -s "${{ inputs.xcode }}" && xcodebuild -version

    # mlx-swift compiles Metal shaders; the Metal toolchain is a separate
    # download since Xcode 26, once per Xcode, and is not preinstalled on the
    # runner image.
    - name: Install Metal toolchain
      shell: bash
      run: sudo xcodebuild -downloadComponent MetalToolchain
