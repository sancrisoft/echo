name: Set up Xcode
description: >-
  Select the Xcode build Echo is developed with and install the Metal
  toolchain that mlx-swift needs to compile its shaders. Shared by the CI
  and Release workflows so the toolchain is pinned in one place.

runs:
  using: composite
  steps:
    # Same Xcode build (17F113) as the local development machine.
    - name: Select Xcode 26.6
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode_26.6.app

    # mlx-swift compiles Metal shaders; the Metal toolchain is a separate
    # download in Xcode 26 and is not preinstalled on the runner image.
    - name: Install Metal toolchain
      shell: bash
      run: sudo xcodebuild -downloadComponent MetalToolchain
