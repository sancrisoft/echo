name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2
      - "v2/**"
  # Both toolchains on any branch, by hand: for a layer in the middle of a
  # stack that is about to be merged on its own, which no pull request run
  # covers (see the scope job).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight, so only the latest
# commit is built. Pushes to main and v2 are never cancelled: every merge commit
# keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what a run builds, on a Linux runner that takes seconds, so a macOS
  # job is only queued when it has something to prove. macOS runners are few
  # and a stack of eleven pull requests used to queue twenty-two jobs of half
  # an hour each, some waiting over an hour to start.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      # Two toolchains, because code that compiles on one need not compile on
      # the other (27 rejected two files 26.6 accepted, and their swift-format
      # versions disagree on test code). 26.6 is the floor the README promises
      # and what releases are built with. Development happens on 27, so a pull
      # request builds on 26.6 alone, the toolchain its author's Mac does not
      # check. Pushes to main and v2, and a manual run, build on both. The 27
      # runner image is a public preview.
      #
      # In a stack, only the top pull request builds. Its head contains every
      # layer below it, the stack merges as a whole, and the push to v2 after
      # the merge builds the result on both toolchains. A pull request from a
      # fork always builds: its branch name means nothing in this repository.
      #
      # A pull request builds every package through one shared scratch path
      # ("shared"), so each dependency compiles once. Pushes and manual runs
      # build each package on its own ("isolated"), the only run that proves
      # every Package.swift declares what it imports.
      - name: Decide what to build
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          floor() { echo '{"name":"Build and test","runner":"macos-26","xcode":"/Applications/Xcode_26.6.app","results":"xcode-26.6","mode":"'"$1"'"}'; }
          newest='{"name":"Build and test (Xcode 27)","runner":"xcode-27","xcode":"/Applications/Xcode_27.0.app","results":"xcode-27.0","mode":"isolated"}'

          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$(floor isolated),$newest]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matrix={\"include\":[$(floor shared)]}" >> "$GITHUB_OUTPUT"

          # gh stack opens a stack's pull requests bottom up, a few seconds
          # apart (37 s for eleven), so the one above may not exist yet when
          # this runs for the one below it.
          above=""
          if [ "$HEAD_REPO" = "$REPO" ]; then
            sleep 30
            above=$(gh pr list --repo "$REPO" --base "$HEAD_REF" --state open \
              --json number --jq 'map("#\(.number)") | join(", ")')
          fi

          if [ -n "$above" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not built here: $above is stacked on this branch, and its run covers this one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    # The 26.6 leg keeps the name this job has always had, "Build and test",
    # so a required-check rule or anything else keyed on it keeps matching. A
    # name that uses the matrix is taken as written, with no values appended;
    # a skipped job has no matrix, hence the fallback.
    name: ${{ matrix.name || 'Build and test' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode
        with:
          xcode: ${{ matrix.xcode }}

      # The formatter ships with the toolchain; the boundary script checks the
      # rules SwiftPM cannot express (dependency direction, no UI in the engine,
      # one environment reader, no UserDefaults).
      - name: Lint
        run: make lint

      # Every package runs its own `swift test` with no host app (ADR-004),
      # each on its own build or all on one. Acceptance suites gate themselves
      # on ECHO_ACCEPTANCE and skip here: CI has no models and no Fixtures/.
      - name: Package tests
        if: matrix.mode == 'isolated'
        run: make test-packages

      - name: Package tests, one shared build
        if: matrix.mode == 'shared'
        run: make test-packages-shared

      # Builds Echo.app (Debug, the test host) and runs the few hosted tests.
      # arm64 only and ad-hoc signed, like the release: there is no signing
      # identity on the runner. No debug info: nobody attaches a debugger here.
      - name: App build and hosted tests
        run: |
          xcodebuild test \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:AppTests \
            -parallel-testing-enabled NO \
            -derivedDataPath build \
            -resultBundlePath build/AppTests.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO

      # The result bundle holds the per-test outcomes, the build log and any
      # attachments; open it in Xcode to see what failed.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AppTests-${{ matrix.results }}.xcresult
          path: build/AppTests.xcresult
          if-no-files-found: ignore
