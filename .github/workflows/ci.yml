name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2
      - "v2/**"

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight, so only the latest
# commit is built. Pushes to main and v2 are never cancelled: every merge commit
# keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The 26.6 leg keeps the name this job has always had, "Build and test",
    # so a required-check rule or anything else keyed on it keeps matching. A
    # name that uses the matrix is taken as written, with no values appended.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Two toolchains, because code that compiles on one need not compile on the
    # other (27 rejected two files 26.6 accepted). 26.6 is the floor the README
    # promises and what releases are built with; 27.0 is what development
    # happens on (the same build, 27A266a). The 27 runner image is a public
    # preview, so neither leg cancels the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            results: AppTests-xcode-26.6
          - name: Build and test (Xcode 27)
            runner: xcode-27
            xcode: /Applications/Xcode_27.0.app
            results: AppTests-xcode-27.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode
        with:
          xcode: ${{ matrix.xcode }}

      # The formatter ships with the toolchain; the boundary script checks the
      # rules SwiftPM cannot express (dependency direction, no UI in the engine,
      # one environment reader, no UserDefaults).
      - name: Lint
        run: make lint

      # Every package runs its own `swift test` with no host app (ADR-004).
      # Acceptance suites gate themselves on ECHO_ACCEPTANCE and skip here:
      # CI has no models and no Fixtures/.
      - name: Package tests
        run: make test-packages

      # Builds Echo.app (Debug, the test host) and runs the few hosted tests.
      # arm64 only and ad-hoc signed, like the release: there is no signing
      # identity on the runner.
      - name: App build and hosted tests
        run: |
          xcodebuild test \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:AppTests \
            -parallel-testing-enabled NO \
            -derivedDataPath build \
            -resultBundlePath build/AppTests.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=-

      # The result bundle holds the per-test outcomes, the build log and any
      # attachments; open it in Xcode to see what failed.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.results }}.xcresult
          path: build/AppTests.xcresult
          if-no-files-found: ignore
