name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Echo
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Xcode build (17F113) as the local development machine.
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # mlx-swift compiles Metal shaders; the Metal toolchain is a separate
      # download in Xcode 26 and is not preinstalled on the runner image.
      - name: Install Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain

      # Ad-hoc signed (no Apple Developer account). arm64 only: the vendored
      # webrtc-apm static lib and MLX are arm64-only.
      - name: Build Echo.app (Release)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Build/Products/Release/Echo.app"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "Echo-$VERSION.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Echo-$VERSION.zip" \
            --title "Echo $VERSION" \
            --generate-notes \
            --notes "Install or update with:

          \`\`\`sh
          gh api -H \"Accept: application/vnd.github.raw\" repos/${GITHUB_REPOSITORY}/contents/scripts/install.sh | bash
          \`\`\`

          No \`gh\`? See the [install instructions](https://github.com/${GITHUB_REPOSITORY}#install) for a curl + token alternative."
