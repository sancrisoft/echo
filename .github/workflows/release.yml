name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Echo
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A hotfix ships INSIDE the version it fixes: `v0.0.10-hotfix.1` rebuilds
      # 0.0.10 and replaces the zip in the existing v0.0.10 release, so that
      # release stays the one users install (scripts/install.sh with no argument
      # fetches the latest release) and no published tag is ever rewritten. The
      # hotfix tag itself is the provenance: it points at the code the
      # replacement artifact was built from. Only the suffix is stripped, so
      # `-rc`/`-beta` style tags keep making their own releases.
      - name: Resolve version
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME%%-hotfix.*}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Same Xcode build (17F113) as the local development machine.
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # mlx-swift compiles Metal shaders; the Metal toolchain is a separate
      # download in Xcode 26 and is not preinstalled on the runner image.
      - name: Install Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain

      # Ad-hoc signed (no Apple Developer account). arm64 only: the vendored
      # webrtc-apm static lib and MLX are arm64-only.
      #
      # The marketing version is the release's (0.0.10 for a hotfix of it, since
      # CFBundleShortVersionString has to stay numeric); the build number is the
      # run number, which is what makes a hotfix build distinguishable from the
      # original one it replaces.
      - name: Build Echo.app (Release)
        run: |
          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package zip
        run: |
          APP="build/Build/Products/Release/Echo.app"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "Echo-$VERSION.zip"

      # Publish: create the release on a normal version tag, or replace the
      # asset in place when the release already exists (a hotfix, or a rebuild
      # of a version). Idempotent on purpose — `gh release create` alone fails
      # on an existing release, which is what used to make re-issuing a version
      # impossible.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists — replacing Echo-$VERSION.zip in place."
            gh release upload "$RELEASE_TAG" "Echo-$VERSION.zip" --clobber
          else
            gh release create "$RELEASE_TAG" "Echo-$VERSION.zip" \
              --title "Echo $VERSION" \
              --generate-notes \
              --notes "Install or update with:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash
          \`\`\`

          Already running Echo? It notices this release on its own — **Update available** in the menu bar popover, or Settings › Updates. See the [install instructions](https://github.com/${GITHUB_REPOSITORY}#install) for the details."
          fi
